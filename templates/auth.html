{% extends "base.html" %}

{% block content %}
<div class="auth-container" style="display: flex; justify-content: center; align-items: center; min-height: 80vh;">
    <div class="glass-card auth-card" style="width: 100%; max-width: 450px; padding: 3rem 2.5rem;">
        
        <div style="display: flex; background: rgba(255,255,255,0.05); border-radius: 12px; margin-bottom: 2rem; padding: 0.25rem;">
            <button class="auth-toggle active" id="loginToggle" onclick="switchTab('login')" style="flex: 1; padding: 0.75rem; border: none; background: transparent; color: var(--text-main); font-weight: 600; cursor: pointer; border-radius: 8px; transition: all 0.3s;">Login</button>
            <button class="auth-toggle" id="registerToggle" onclick="switchTab('register')" style="flex: 1; padding: 0.75rem; border: none; background: transparent; color: var(--text-muted); font-weight: 600; cursor: pointer; border-radius: 8px; transition: all 0.3s;">Register</button>
        </div>

        <!-- Login Form -->
        <form id="loginForm" method="POST" action="{{ url_for('login') }}">
            <h2 style="margin-bottom: 1.5rem; text-align: center;">Welcome Back</h2>
            <div class="form-group">
                <label><i class="fa-solid fa-envelope"></i> Email</label>
                <input type="email" name="email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label><i class="fa-solid fa-lock"></i> Password</label>
                <div class="password-input">
                    <input type="password" name="password" placeholder="Enter your password" id="loginPass" required>
                    <i class="fa-regular fa-eye toggle-password" onclick="togglePassword('loginPass')"></i>
                </div>
            </div>
            <button type="submit" class="submit-btn">Login</button>
        </form>

        <!-- Register Form -->
        <form id="registerForm" method="POST" action="{{ url_for('register') }}" style="display: none;">
            <h2 style="margin-bottom: 1.5rem; text-align: center;">Create Account</h2>
            <div class="form-group">
                <label><i class="fa-solid fa-user"></i> Full Name</label>
                <input type="text" name="name" placeholder="Enter your full name" required>
            </div>
            <div class="form-group">
                <label><i class="fa-solid fa-envelope"></i> Email</label>
                <input type="email" name="email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label><i class="fa-solid fa-lock"></i> Password</label>
                <div class="password-input">
                    <input type="password" name="password" placeholder="Create a password" id="regPass" required>
                    <i class="fa-regular fa-eye toggle-password" onclick="togglePassword('regPass')"></i>
                </div>
            </div>
            <button type="submit" class="submit-btn">Register</button>
        </form>
    </div>
</div>

<style>
    .auth-toggle.active { background: var(--primary); color: white !important; box-shadow: 0 0 15px var(--primary-glow); }
    .form-group { margin-bottom: 1.5rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; color: var(--text-muted); font-size: 0.9rem; }
    .form-group input { width: 100%; padding: 0.8rem 1rem; background: rgba(0,0,0,0.2); border: 1px solid var(--border-light); border-radius: 8px; color: white; transition: all 0.3s; }
    .form-group input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 10px var(--primary-glow); }
    .password-input { position: relative; }
    .toggle-password { position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); cursor: pointer; }
    .submit-btn { width: 100%; padding: 1rem; background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; border: none; border-radius: 8px; font-weight: 600; font-size: 1rem; cursor: pointer; margin-top: 1rem; transition: all 0.3s; }
    .submit-btn:hover { box-shadow: 0 0 20px var(--primary-glow); transform: translateY(-2px); }
    .submit-btn:hover { box-shadow: 0 0 20px var(--primary-glow); transform: translateY(-2px); }
</style>
<script>
    function switchTab(tab) {
        document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
        document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
        document.getElementById('loginToggle').classList.toggle('active', tab === 'login');
        document.getElementById('registerToggle').classList.toggle('active', tab === 'register');
    }
    function togglePassword(inputId) {
        const input = document.getElementById(inputId);
        const icon = input.nextElementSibling;
        if (input.type === 'password') { input.type = 'text'; icon.classList.replace('fa-eye', 'fa-eye-slash'); }
        else { input.type = 'password'; icon.classList.replace('fa-eye-slash', 'fa-eye'); }
    }
</script>
{% endblock %}
